name: 7 Build Linux Tray

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'esurfingclient/app/tray-linux/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            appindicator: libayatana-appindicator3-dev

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 获取版本号
        id: version
        run: bash scripts/sync-version.sh --print >> "$GITHUB_OUTPUT"

      - name: 安装托盘依赖 (appindicator + gcc)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config ${{ matrix.appindicator }}

      - name: 编译托盘
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd esurfingclient/app/tray-linux
          go mod tidy
          go build -ldflags "-s -w" -o "esurfing-tray-linux-${{ matrix.arch }}" .
          file "esurfing-tray-linux-${{ matrix.arch }}"
          ls -lh "esurfing-tray-linux-${{ matrix.arch }}"

      - name: 打包 zip
        run: |
          cd esurfingclient/app/tray-linux
          zip "esurfing-tray-linux-${{ matrix.arch }}.zip" "esurfing-tray-linux-${{ matrix.arch }}"
          ls -lh "esurfing-tray-linux-${{ matrix.arch }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: esurfing-tray-linux-${{ matrix.arch }}
          path: esurfingclient/app/tray-linux/esurfing-tray-linux-${{ matrix.arch }}.zip
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: 获取版本号
        id: version
        run: bash scripts/sync-version.sh --print >> "$GITHUB_OUTPUT"

      - name: 下载所有工件
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 展平发布文件
        run: |
          mkdir -p release_files
          find artifacts -type f -name "*.zip" -exec cp {} release_files/ \;
          echo "=== 待发布文件 ==="
          ls -lh release_files/

      - name: 发布/追加到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="tray-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在，追加文件"
            gh release upload "$TAG" release_files/* --clobber
          else
            echo "创建新 Release"
            gh release create "$TAG" release_files/* --title "ESurfingClient Tray ${TAG}" --generate-notes
          fi
