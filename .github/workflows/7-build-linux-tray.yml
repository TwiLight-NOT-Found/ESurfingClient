name: 7 Build Linux Tray

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'esurfingclient/app/tray-linux/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            appindicator: libayatana-appindicator3-dev

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 安装托盘依赖 (appindicator + gcc)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config ${{ matrix.appindicator }}

      - name: 编译托盘
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd esurfingclient/app/tray-linux
          go mod tidy
          go build -ldflags "-s -w" -o "esurfing-tray-linux-${{ matrix.arch }}" .
          file "esurfing-tray-linux-${{ matrix.arch }}"
          ls -lh "esurfing-tray-linux-${{ matrix.arch }}"

      - name: 上传工件
        uses: actions/upload-artifact@v7
        with:
          name: esurfing-tray-linux-${{ matrix.arch }}
          path: esurfingclient/app/tray-linux/esurfing-tray-linux-${{ matrix.arch }}
          retention-days: 30
